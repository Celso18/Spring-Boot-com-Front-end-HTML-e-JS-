<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Alunos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .btn-get { background-color: #2196F3; }
        .btn-post { background-color: #4CAF50; }
        .btn-put { background-color: #FF9800; }
        .btn-delete { background-color: #f44336; }
        button:hover { opacity: 0.9; }
        #telaResposta {
            margin-top: 20px;
            padding: 15px;
            background: #e9e9e9;
            border-radius: 4px;
            min-height: 50px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulário do Aluno</h2>
    
    <!-- ID (Necessário para GET específico, PUT e DELETE) -->
    <div class="form-group">
        <label for="id">ID do Aluno (Atualizar/Deletar/Buscar):</label>
        <input type="number" id="id" placeholder="Ex: 1">
    </div>

    <!-- Atributos da classe Aluno -->
    <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Nome completo">
    </div>

    <div class="form-group">
        <label for="idade">Idade:</label>
        <input type="number" id="idade" placeholder="Ex: 20">
    </div>

    <div class="form-group">
        <label for="registroAluno">Registro do Aluno (RA):</label>
        <input type="text" id="registroAluno" placeholder="Ex: RA123456">
    </div>

    <div class="form-group">
        <label for="emailInstitucional">E-mail Institucional:</label>
        <input type="email" id="emailInstitucional" placeholder="aluno@instituicao.com">
    </div>

    <div class="form-group">
        <label for="turma">Turma:</label>
        <input type="text" id="turma" placeholder="Ex: 3º Ano A">
    </div>

    <div class="form-group">
        <label for="periodo">Período:</label>
        <input type="text" id="periodo" placeholder="Ex: Matutino / Noturno">
    </div>

    <div class="form-group">
        <label for="apresentacao">Apresentação:</label>
        <textarea id="apresentacao" rows="3" placeholder="Breve resumo sobre o aluno..."></textarea>
    </div>

    <!-- Botões de Ação CRUD -->
    <div class="button-group">
        <button type="button" class="btn-get" onclick="fazerGET()">Consultar (GET)</button>
        <button type="button" class="btn-post" onclick="fazerPOST()">Cadastrar (POST)</button>
        <button type="button" class="btn-put" onclick="fazerPUT()">Atualizar (PUT)</button>
        <button type="button" class="btn-delete" class="btn-delete" onclick="fazerDELETE()">Excluir (DELETE)</button>
    </div>

    <h3>Resultado do Servidor:</h3>
    <!-- Local para exibição das respostas obtidas do Java -->
    <div id="telaResposta">Nenhuma requisição feita ainda.</div>
</div>

<!-- Importação do arquivo JavaScript onde as funções acima serão implementadas -->
<script src="JS/app.js"></script>
</body>
</html>
