<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Aluno - Teste de API</title>
    
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-3">Painel do Aluno - Teste de API</h2>
        <p class="text-secondary">Preencha os campos abaixo e clique no verbo HTTP que deseja testar.</p>

        <!-- Formulário -->
        <div class="mb-3">
            <input type="number" id="inputId" class="form-control" placeholder="ID (Para PUT ou DELETE)">
        </div>
        <div class="mb-3">
            <input type="text" id="inputNome" class="form-control" placeholder="Nome do Aluno">
        </div>
        <div class="mb-3">
            <input type="number" id="inputIdade" class="form-control" placeholder="Idade">
        </div>
        <div class="mb-3">
            <input type="text" id="inputRA" class="form-control" placeholder="Registro Aluno (RA)">
        </div>
        <div class="mb-3">
            <input type="email" id="inputEmail" class="form-control" placeholder="E-mail Institucional">
        </div>
        <div class="mb-3">
            <input type="text" id="inputTurma" class="form-control" placeholder="Turma">
        </div>
        <div class="mb-3">
            <input type="text" id="inputPeriodo" class="form-control" placeholder="Período">
        </div>
        <div class="mb-3">
            <input type="text" id="inputApresentacao" class="form-control" placeholder="Apresentação">
        </div>

        <!-- Botões -->
        <div class="d-flex gap-2 flex-wrap mb-4">
            <button id="btnGet" class="btn btn-primary">GET (Buscar Todos)</button>
            <button id="btnPost" class="btn btn-success">POST (Criar Novo)</button>
            <button id="btnPut" class="btn btn-warning">PUT (Atualizar)</button>
            <button id="btnDelete" class="btn btn-danger">DELETE (Apagar)</button>
        </div>

        <!-- Resposta do Servidor -->
        <h4>Resposta do Servidor (Spring Boot):</h4>
        <div class="mt-3">
            <pre id="telaResposta" class="p-3 bg-dark text-white rounded" style="min-height: 100px;">Aguardando ação...</pre>
        </div>
    </div>

    <!-- Vinculação do arquivo JS -->
    <script src="app.js"></script>
</body>
</html>
